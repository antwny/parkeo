# =============================================================================
# PARKeo · Android
# Archivo: gradle-daemon-jvm.properties
# Tipo/capa: configuración de la JVM del daemon de Gradle.
# Propósito: indicar qué JDK debe usar Gradle para ejecutar el daemon y de dónde
#            descargarlo si no está instalado. La selección se hace por sistema
#            operativo y arquitectura, de modo que el build sea reproducible en
#            Linux, macOS y Windows, tanto x86_64 como ARM64.
# Conceptos clave: toolchain de Java, daemon de Gradle, API de Foojay
#            (proveedor de JDKs), URL de descarga por plataforma y versión fijada.
# Relación: trabaja junto con `gradle/wrapper/gradle-wrapper.properties` (versión
#            de Gradle) y con `gradle.properties` (memoria del daemon). El código
#            de la app se compila con Java 17 según `app/build.gradle.kts`,
#            mientras que el daemon puede ejecutarse en una JVM más reciente.
# Guía: docs/GUIA_MAESTRA_ESTUDIANTE.md
# =============================================================================

# Archivo generado automáticamente por la tarea `updateDaemonJvm`. No conviene
# editarlo a mano: si se necesita otro JDK, se regenera con Gradle para que las
# URL y los identificadores de descarga sigan siendo válidos.

# Cada clave `toolchainUrl.<SO>.<ARQUITECTURA>` apunta al endpoint de Foojay que
# redirige al JDK correspondiente. `FREE_BSD` y `UNIX` cubren variantes de Unix;
# `MAC_OS` distingue Apple Silicon (AARCH64) de Intel (X86_64); `WINDOWS` cubre
# las mismas arquitecturas. Tener una URL por plataforma evita depender de un
# JDK instalado globalmente y permite que el wrapper lo descargue si falta.
toolchainUrl.FREE_BSD.AARCH64=https\://api.foojay.io/disco/v3.0/ids/cf726b4a1c84b50457225f9bba6d7650/redirect
toolchainUrl.FREE_BSD.X86_64=https\://api.foojay.io/disco/v3.0/ids/fa1e318c287360478e3c83a9a3ef1007/redirect
toolchainUrl.LINUX.AARCH64=https\://api.foojay.io/disco/v3.0/ids/cf726b4a1c84b50457225f9bba6d7650/redirect
toolchainUrl.LINUX.X86_64=https\://api.foojay.io/disco/v3.0/ids/fa1e318c287360478e3c83a9a3ef1007/redirect
toolchainUrl.MAC_OS.AARCH64=https\://api.foojay.io/disco/v3.0/ids/c2dd35c9d0aaf0ba6ad0791320f99dfc/redirect
toolchainUrl.MAC_OS.X86_64=https\://api.foojay.io/disco/v3.0/ids/e5810bd7fd1f8a586644409d395a7e55/redirect
toolchainUrl.UNIX.AARCH64=https\://api.foojay.io/disco/v3.0/ids/cf726b4a1c84b50457225f9bba6d7650/redirect
toolchainUrl.UNIX.X86_64=https\://api.foojay.io/disco/v3.0/ids/fa1e318c287360478e3c83a9a3ef1007/redirect
toolchainUrl.WINDOWS.AARCH64=https\://api.foojay.io/disco/v3.0/ids/7b3c4877c0749019e6805bb61e421497/redirect
toolchainUrl.WINDOWS.X86_64=https\://api.foojay.io/disco/v3.0/ids/d76df094a9cbbabd3b08251f9e61444a/redirect

# Versión mayor de Java que Gradle intentará usar para el daemon. Fijarla evita
# diferencias entre máquinas y asegura que todos compilen con la misma JVM base;
# no debe confundirse con `sourceCompatibility`/`targetCompatibility` del módulo,
# que fijan el bytecode de la app en Java 17.
toolchainVersion=25
