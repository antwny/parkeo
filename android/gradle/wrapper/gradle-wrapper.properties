# =============================================================================
# PARKeo · Android
# Archivo: gradle/wrapper/gradle-wrapper.properties
# Tipo/capa: configuración del Gradle Wrapper.
# Propósito: fijar la distribución exacta de Gradle que descargará y ejecutará
#            `gradlew`/`gradlew.bat`, y dónde se guarda en la máquina local.
# Conceptos clave: wrapper, distribución `-bin`, versión reproducible de Gradle,
#            caché en `GRADLE_USER_HOME`, timeout de red y validación de URL.
# Relación: `gradlew` y `gradlew.bat` leen este archivo a través de
#            `gradle-wrapper.jar`; la versión de Gradle debe ser compatible con
#            el AGP declarado en `libs.versions.toml` y con el JDK del daemon
#            configurado en `gradle/gradle-daemon-jvm.properties`.
# Guía: docs/GUIA_MAESTRA_ESTUDIANTE.md
# =============================================================================

# Directorio base de la distribución: `GRADLE_USER_HOME`, normalmente
# `~/.gradle` (o `%USERPROFILE%\.gradle` en Windows). Guardar aquí la descarga
# permite reutilizarla entre proyectos y usuarios sin ensuciar el repositorio.
distributionBase=GRADLE_USER_HOME

# Subruta dentro de la caché donde se descomponen las distribuciones del wrapper.
distributionPath=wrapper/dists

# Distribución fijada: Gradle 9.6.0, variante `-bin` (solo binarios, sin fuentes
# ni documentación). La versión exacta hace que todos los desarrolladores y la
# CI compilen con el mismo motor; cambiar de Gradle implica revisar la
# compatibilidad con AGP y Kotlin. Los dos puntos se escapan con `\:` porque el
# archivo usa el formato de propiedades de Java.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip

# Tiempo máximo, en milisegundos, para descargar la distribución antes de
# abortar. Evita que un build quede bloqueado indefinidamente con una red lenta.
networkTimeout=10000

# Verifica que la URL de la distribución sea válida y use un origen permitido
# antes de descargarla. Es una protección contra configuraciones manipuladas.
validateDistributionUrl=true

# Caché de los archivos ZIP descargados. Se mantiene separada de la carpeta
# descomprimida para poder reutilizar la descarga o limpiarla sin afectar al
# resto de la caché de Gradle.
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
