# =============================================================================
# PARKeo · Android
# Archivo: gradle.properties
# Tipo/capa: propiedades del build de Gradle (nivel de proyecto).
# Propósito: ajustar la JVM que ejecuta Gradle y el comportamiento de AndroidX,
#            Kotlin y la generación de la clase `R`. Gradle lee estas claves al
#            iniciar el daemon y las aplica a todos los módulos.
# Conceptos clave: memoria de la JVM, codificación de archivos, AndroidX,
#            estilo oficial de Kotlin y clases `R` no transitivas.
# Relación: complementa `gradle-daemon-jvm.properties` (selección del JDK) y
#            afecta a cómo se compilan los recursos consumidos por Compose y por
#            el módulo `:app`. No contiene secretos: las claves de Maps y la URL
#            del backend viven en `local.properties`.
# Guía: docs/GUIA_MAESTRA_ESTUDIANTE.md
# =============================================================================

# Memoria máxima del daemon de Gradle (2 GB) y codificación UTF-8 para compilar
# fuentes y leer recursos con acentos o caracteres especiales. `-Xmx` es el
# límite del heap; si el proyecto crece o aparecen errores de memoria, puede
# ajustarse, pero un valor excesivo resta recursos al resto del sistema.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Habilita el uso de bibliotecas AndroidX en lugar de las antiguas Support
# Libraries. Es obligatorio para este proyecto: todas las dependencias de UI,
# ciclo de vida, navegación, DataStore y WorkManager son AndroidX.
android.useAndroidX=true

# Adopta el estilo oficial de Kotlin (convenciones de formato del compilador).
# No cambia la lógica, pero mantiene consistencia si se generan fuentes o se
# aplican herramientas de formato compatibles con Kotlin.
kotlin.code.style=official

# Genera clases `R` no transitivas: cada módulo solo ve los recursos que declara,
# no los de sus dependencias. Reduce el tamaño de `R` y evita que el código de
# `:app` dependa accidentalmente de identificadores internos de una librería.
android.nonTransitiveRClass=true
