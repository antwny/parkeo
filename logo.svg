<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fondo oscuro elegante para contrastar con el verde limón -->
    <linearGradient id="appBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182210" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Degradado Verde Limón para el Pin de Ubicación -->
    <linearGradient id="limePinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BEF264" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <!-- Sombra suave para dar volumen -->
    <filter id="pinShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Fondo base con esquinas redondeadas -->
  <rect width="512" height="512" rx="112" fill="url(#appBgGrad)" />

  <!-- Sombra proyectada en la base -->
  <ellipse cx="256" cy="435" rx="70" ry="16" fill="#000000" opacity="0.4" />

  <!-- Marcador de Ubicación Pin -->
  <g filter="url(#pinShadow)">
    <path d="M 256 65 
             C 165 65, 100 138, 100 222 
             C 100 325, 232 418, 256 435 
             C 280 418, 412 325, 412 222 
             C 412 138, 347 65, 256 65 Z" 
          fill="url(#limePinGrad)" />

    <!-- Círculo interior oscuro (genera alto contraste) -->
    <circle cx="256" cy="215" r="80" fill="#0F172A" />

    <!-- Letra P en Verde Limón Neón -->
    <text x="256" y="260" 
          font-family="'Impact', 'Arial Black', sans-serif" 
          font-size="130" 
          fill="#A3E635" 
          text-anchor="middle">P</text>
  </g>
</svg>
